name: Check legacy Smart Order source
on:
  push:
    branches:
      - legacy-app-check-20260921
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect legacy product paging code
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://smart-order-ngoc-trai.ngoctrai7785.chatgpt.site"
          curl -fsS --max-time 45 -H "cache-control: no-cache" "$BASE/smart-order-v26?mode=order&view=customer&npp=npp1&_=$(date +%s)" -o /tmp/app.html
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/app.html','utf8');
          const needles=['Đang hiển thị','customerProduct','loadMore','visibleCount','pageSize','Xem thêm','24 sản phẩm','slice(0,','products.length'];
          for(const n of needles){
            let pos=0,count=0;
            while((pos=html.indexOf(n,pos))>=0 && count<8){
              const s=html.slice(Math.max(0,pos-700),Math.min(html.length,pos+1800))
                .replace(/data:image\/[a-z+.-]+;base64,[A-Za-z0-9+/=]+/g,'[IMAGE_DATA]')
                .replace(/data:image\/svg\+xml[^"'\s)]+/g,'[SVG_DATA]');
              console.log('\n--- '+n+' @ '+pos+' ---\n'+s);
              pos+=n.length;count++;
            }
          }
          NODE

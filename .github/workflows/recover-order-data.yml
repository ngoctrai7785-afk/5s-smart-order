name: Recover Smart Order data
on:
  push:
    branches:
      - recovery-check-20260921
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger safe migration
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://upojgdqkkjwtbrzljffo.supabase.co/functions/v1/smart-order-api"
          curl -fsS --max-time 45 -H "x-order-tenant: npp1" "$BASE/catalog?tenant=npp1&recover=1" -o /tmp/catalog.json
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/catalog.json","utf8"));const s=j.state||{};console.log(JSON.stringify({catalog_ok:!!j.state,products:(s.products||[]).length,categories:(s.categories||[]).length,promotions:(s.promotions||[]).length,migrated_from:j.migrated_from||null}))'
          curl -fsS --max-time 45 -H "x-order-tenant: npp1" "$BASE/health?tenant=npp1" -o /tmp/health.json
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));console.log(JSON.stringify({health_ok:j.ok===true,counts:j.counts||{},migrated_from:j.migrated_from||null}))'
          curl -fsS --max-time 45 -H "x-order-tenant: npp1" "$BASE/images?id=639e6c3b-323f-4a8f-9430-7dbf8a8ae91e&tenant=npp1" -o /tmp/test-image.bin -D /tmp/test-image.headers
          echo "image_bytes=$(wc -c < /tmp/test-image.bin)"
          grep -i '^content-type:' /tmp/test-image.headers | head -1
      - name: Migrate all recovered product images
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://upojgdqkkjwtbrzljffo.supabase.co/functions/v1/smart-order-api"
          curl -fsS --max-time 60 -H "x-order-tenant: npp1" "$BASE/catalog?tenant=npp1&_=$(date +%s)" -o /tmp/catalog-all.json
          cat > /tmp/migrate-images.mjs <<'NODE'
          import fs from 'node:fs';
          const base='https://upojgdqkkjwtbrzljffo.supabase.co/functions/v1/smart-order-api';
          const j=JSON.parse(fs.readFileSync('/tmp/catalog-all.json','utf8'));
          const s=j.state||{};
          const values=[
            ...(s.products||[]).map(x=>x.image),
            ...(s.promotions||[]).map(x=>x.giftImage)
          ].filter(x=>typeof x==='string'&&x.startsWith('/api/images?id='));
          const unique=[...new Set(values.map(x=>new URL(x,'https://legacy.local').searchParams.get('id')).filter(Boolean))];
          let cursor=0,ok=0,fail=0;
          async function worker(){
            while(true){
              const i=cursor++;
              if(i>=unique.length) return;
              const id=unique[i];
              try{
                const r=await fetch(base+'/images?id='+encodeURIComponent(id)+'&tenant=npp1',{headers:{'x-order-tenant':'npp1'}});
                if(r.ok){await r.arrayBuffer();ok++;}else fail++;
              }catch{fail++;}
            }
          }
          await Promise.all(Array.from({length:8},worker));
          console.log(JSON.stringify({unique_images:unique.length,ok,fail}));
          if(fail) process.exitCode=1;
          NODE
          node /tmp/migrate-images.mjs

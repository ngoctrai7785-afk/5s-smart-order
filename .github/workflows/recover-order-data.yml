name: Verify live Smart Order frontends
on:
  push:
    branches:
      - recovery-check-20260921
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare live frontends
        shell: bash
        run: |
          set -euo pipefail
          check () {
            label="$1"; url="$2"; out="/tmp/$label.html"; hdr="/tmp/$label.hdr"
            code=$(curl -sS -L --max-time 60 -D "$hdr" -o "$out" -w "%{http_code}" "$url" || true)
            final=$(curl -sS -L --max-time 60 -o /dev/null -w "%{url_effective}" "$url" || true)
            bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
            phrase=$( { grep -o "Xem thêm 24 sản phẩm" "$out" 2>/dev/null || true; } | wc -l | tr -d ' ' )
            phrase2=$( { grep -o "Đang hiển thị 24 / 294 sản phẩm" "$out" 2>/dev/null || true; } | wc -l | tr -d ' ' )
            full=$( { grep -o "full-catalog-20260921" "$out" 2>/dev/null || true; } | wc -l | tr -d ' ' )
            echo "$label status=$code bytes=$bytes phrase24=$phrase phrase24of294=$phrase2 fullmark=$full final=$final"
          }
          check vercel_root "https://5s-smart-order.vercel.app/?mode=order&view=customer&tenant=npp1&appv=full-catalog-20260921"
          check vercel_order "https://5s-smart-order.vercel.app/dat-hang?mode=order&view=customer&tenant=npp1&appv=full-catalog-20260921"
          check old_chatgpt "https://smart-order-ngoc-trai.ngoctrai7785.chatgpt.site/smart-order-v26?mode=order&view=customer&npp=npp1"

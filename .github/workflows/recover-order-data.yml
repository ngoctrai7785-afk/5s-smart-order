name: Verify Smart Order recovery
on:
  push:
    branches:
      - recovery-check-20260921
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify missing legacy images
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://upojgdqkkjwtbrzljffo.supabase.co/functions/v1/smart-order-api"
          IDS="54e3c078-21a7-4775-be99-95f6d030e8dc 4893ed5f-8221-4d29-b9d9-a6bf1445d58c 3c102c85-049c-4e40-9adc-6fe94e03ec86 3e879c52-d1d2-4bc3-9b3c-1184d0a2954f f8e82ebf-81ac-49b4-8dc3-459ebd7a5ca8 7dd9f68a-0b00-4f7c-8b4a-5a1a0dfc83d8 074d5345-de66-4339-a408-08de630733f5"
          for id in $IDS; do
            code=$(curl -sS --max-time 30 -o /tmp/img.bin -w "%{http_code}" -H "x-order-tenant: npp1" "$BASE/images?id=$id&tenant=npp1" || true)
            bytes=$(wc -c < /tmp/img.bin 2>/dev/null || echo 0)
            echo "edge $id status=$code bytes=$bytes"
          done
          code=$(curl -sS --max-time 30 -o /tmp/vercel.bin -w "%{http_code}" "https://5s-smart-order.vercel.app/api/images?id=639e6c3b-323f-4a8f-9430-7dbf8a8ae91e&tenant=npp1" || true)
          bytes=$(wc -c < /tmp/vercel.bin 2>/dev/null || echo 0)
          echo "vercel_image status=$code bytes=$bytes"

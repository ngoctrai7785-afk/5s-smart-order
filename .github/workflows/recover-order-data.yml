name: Inspect live Smart Order pagination code
on:
  push:
    branches:
      - recovery-check-20260921
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 "https://smart-order-ngoc-trai.ngoctrai7785.chatgpt.site/smart-order-v26?mode=order&view=customer&npp=npp1" -o /tmp/old.html
          curl -fsSL --max-time 60 "https://5s-smart-order.vercel.app/?mode=order&view=customer&tenant=npp1" -o /tmp/new.html
          cat > /tmp/inspect.mjs <<'NODE'
          import fs from 'node:fs';
          for (const [label,file] of [['old','/tmp/old.html'],['new','/tmp/new.html']]) {
            const c=fs.readFileSync(file,'utf8');
            const needles=['Xem thêm','Đang hiển thị','loadMore','visibleCount','productVisible','slice(0,','+=24','+ 24','24 /','sản phẩm'];
            console.log('SOURCE',label,'bytes',c.length);
            for(const n of needles){
              let pos=0,count=0;
              while((pos=c.indexOf(n,pos))>=0 && count<8){
                const snip=c.slice(Math.max(0,pos-260),Math.min(c.length,pos+700)).replace(/\s+/g,' ');
                console.log('MATCH',label,JSON.stringify(n),'at',pos,':',snip);
                pos+=n.length;count++;
              }
              if(!count) console.log('MATCH',label,JSON.stringify(n),'NONE');
            }
          }
          NODE
          node /tmp/inspect.mjs
